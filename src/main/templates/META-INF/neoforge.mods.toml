modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="KlNon"
# 仅服务端安装,客户端无需存在
displayTest="IGNORE_ALL_VERSION"
description='''
Web admin panel for Sable sub-levels: full-save disk index, cleanup suggestions, teleport/delete/adopt with a recycle bin, 3D voxel preview, per-body cost profiling, multi-server clustering on one port. Server-side only.
Sable 物理体网页管理面板:全量存档索引 / 清理建议 / 传送・删除・孤儿收养(带回收站)/ 3D 体素预览 / 逐体耗时分析 / 同机多服共用一个端口。另含生命周期 JSONL 日志与 /sablepanel dump 快照。仅服务端安装。
'''

[[mixins]]
config="sablepanel.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"
